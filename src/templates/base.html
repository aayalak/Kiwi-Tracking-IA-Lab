<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>KiwiTrackingIA</title>
    <link rel="stylesheet" href="/static/estilos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .sidebar {
            min-width: 200px;
            max-width: 220px;
            background-color: #198754;
            min-height: 80vh;
            color: white;
            padding-top: 30px;
        }
        .sidebar .nav-link {
            color: #fff;
            margin-bottom: 12px;
            font-size: 1.1em;
        }
        .sidebar .nav-link.active, .sidebar .nav-link:hover {
            background: #145a32;
            border-radius: 6px;
        }
        .content-area {
            padding: 20px 30px;
            background: white;
            border-radius: 12px;
            min-height: 80vh;
            box-shadow: 0 4px 24px rgba(0,0,0,0.04);
        }
    </style>
    <style>
      .flor-femenina { color: #c2185b; font-weight: bold; }
      .flor-masculina { color: #1976d2; font-weight: bold; }
      .flor-otra { color: #007944; font-weight: bold; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

<!-- HEADER -->
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/">Kiwi Tracking IA</a>
    <span class="navbar-text ms-3 text-white fw-light">
        Seguimiento y análisis inteligente de kiwis
    </span>
  </div>
</nav>

<!-- MAIN -->
<div class="container-fluid flex-grow-1" style="min-height: 82vh;">
  <div class="row">
    <!-- SIDEBAR IZQUIERDA -->
    <aside class="col-md-2 sidebar d-flex flex-column">
      <nav class="nav flex-column">
        <a class="nav-link {% if request.url.path == '/' %}active{% endif %}" href="/">Captura en vivo</a>
        <a class="nav-link {% if '/analizar_imagenes' in request.url.path %}active{% endif %}" href="/analizar_imagenes">Kiwi - Análisis por foto</a>
        <a class="nav-link {% if '/analizar_imagenes_flor' in request.url.path %}active{% endif %}" href="/analizar_imagenes_flor">Flor - Análisis por foto</a>
        <a class="nav-link {% if '/analizar_imagenes_flor_brote' in request.url.path %}active{% endif %}" href="/analizar_imagenes_flor_brote">Brote - Análisis por foto</a>
        <a class="nav-link {% if '/analizar_imagenes_yemas' in request.url.path %}active{% endif %}" href="/analizar_imagenes_yemas">Yemas - Análisis por foto</a>
        <a class="nav-link {% if '/galeria' in request.url.path %}active{% endif %}" href="/galeria">Galería</a>
        <a class="nav-link {% if '/resultados_analisis' in request.url.path %}active{% endif %}" href="/resultados_analisis">Galería de análisis</a>
      </nav>
    </aside>
    <!-- CONTENIDO CENTRAL -->
    <section class="col-md-10 content-area">
        {% block content %}{% endblock %}
    </section>
  </div>
</div>

<!-- FOOTER -->
<footer class="bg-success text-center text-white py-2 mt-4">
    <small>&copy; {{ now().year }} KiwiTrackingIA</small>
</footer>
</body>
</html>
